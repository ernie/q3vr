name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.5.2
        with:
          vulkan_version: '1.4.350.0'
          cache: true
          stripdown: true

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022"
          cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc
          path: |
            build/Release/**/*.dll
            build/Release/**/q3vr.exe
            build/Release/**/glq3vr.exe
            build/Release/**/*.pk3
          if-no-files-found: error
          retention-days: 5

  windows-mingw:
    name: Windows MinGW
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.5.2
        with:
          vulkan_version: '1.4.350.0'
          cache: true
          stripdown: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-mingw
          path: |
            build/Release/**/*.dll
            build/Release/**/q3vr.exe
            build/Release/**/glq3vr.exe
            build/Release/**/*.pk3
          if-no-files-found: error
          retention-days: 5

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libxcb-glx0-dev libgl-dev libxxf86vm-dev

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.5.2
        with:
          vulkan_version: '1.4.350.0'
          cache: false      # v1.5.x cache restore is broken on Linux
          stripdown: false  # appears to remove libvulkan.so on Linux

      # SDK 1.4.350 moved the loader out of $VULKAN_SDK/lib/, so CMake's
      # find_library(NAMES vulkan) misses it. Locate it and re-expose at the
      # expected path.
      - name: Ensure libvulkan.so symlink
        run: |
          find "$VULKAN_SDK" -name 'libvulkan*' -ls 2>/dev/null
          LIBVK=$(find "$VULKAN_SDK" -name 'libvulkan.so' -print -quit 2>/dev/null)
          [ -z "$LIBVK" ] && LIBVK=$(find "$VULKAN_SDK" -name 'libvulkan.so.1' -print -quit 2>/dev/null)
          if [ -n "$LIBVK" ] && [ ! -e "$VULKAN_SDK/lib/libvulkan.so" ]; then
            ln -sv "$LIBVK" "$VULKAN_SDK/lib/libvulkan.so"
          fi

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/Release/**/*.so
            build/Release/**/q3vr
            build/Release/**/glq3vr
            build/Release/**/*.pk3
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [windows-msvc, windows-mingw, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            misc/update-trinity.bat
            misc/update-trinity.sh

      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Download Trinity assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trinity-assets
          gh release download --repo ernie/trinity --pattern 'pak8t.pk3' --dir trinity-assets
          gh release download --repo ernie/trinity --pattern 'pak3t.pk3' --dir trinity-assets
          gh release download --repo ernie/trinity --pattern 'zzz-trinity-announcer.pk3' --dir trinity-assets

      - name: Bundle Trinity assets
        run: |
          for dir in windows-msvc windows-mingw linux; do
            if [ -d "$dir" ]; then
              echo "Bundling Trinity assets into $dir/"
              find "$dir" -type d -name baseq3 -exec cp trinity-assets/pak8t.pk3 {} \;
              find "$dir" -type d -name missionpack -exec cp trinity-assets/pak3t.pk3 {} \;
              find "$dir" -type d -name baseq3 -exec cp trinity-assets/zzz-trinity-announcer.pk3 {} \;
            fi
          done

      - name: Bundle update scripts
        run: |
          for dir in windows-msvc windows-mingw; do
            [ -d "$dir" ] && cp misc/update-trinity.bat "$dir/"
          done
          [ -d linux ] && cp misc/update-trinity.sh linux/

      - name: Create archives
        run: |
          7z a -r q3vr-windows-msvc-x86_64.zip    ./windows-msvc/*
          7z a -r q3vr-windows-mingw-x86_64.zip   ./windows-mingw/*
          7z a -r q3vr-linux-x86_64.zip            ./linux/*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
          generate_release_notes: true
